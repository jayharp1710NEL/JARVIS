[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local"
version = "0.1.0"
description = "JARVIS-LOCAL — a local-first, private, tool-using AI agent operating layer."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "httpx>=0.26",
    "sqlalchemy>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "numpy>=1.24",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavier / optional capabilities. Core works without these.
rag = ["pypdf>=4.0", "python-docx>=1.1"]
embeddings = ["sentence-transformers>=2.5"]
extract = ["trafilatura>=1.6", "readability-lxml>=0.8"]
chroma = ["chromadb>=0.4"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.scripts]
jarvis = "app.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
